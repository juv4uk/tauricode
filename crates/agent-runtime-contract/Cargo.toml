[package]
name = "agent-runtime-contract"
version = "0.1.0"
edition = "2021"
publish = false
description = "Stage 2 runtime-adapter boundary: the generic contract Tauricode Core uses to launch, observe, and control any agent runtime (OpenCode, Claude, future adapters) without depending on which one is underneath. See docs/STAGE2-RUNTIME-ADAPTER-PLAN.md."

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[features]
# Exposes MockAdapter outside this crate's own test build (e.g. for a
# future scheduler/dashboard integration test) without making it part
# of the crate's default production surface.
mock = []
# Real, subprocess-spawning OpenCode adapter (M2.5). Opt-in: a default
# build/test run never spawns a real process.
opencode = []

# Declared so `cargo build/clippy --all-targets` (no features) skips this
# target instead of failing to compile it - the test genuinely needs both
# concrete adapters (M2.9's whole point), it isn't an oversight that it
# can't build without them.
[[test]]
name = "second_adapter_proof"
required-features = ["mock", "opencode"]
