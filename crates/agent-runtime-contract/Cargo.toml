[package]
name = "agent-runtime-contract"
version = "0.1.0"
edition = "2021"
publish = false
description = "Stage 2 runtime-adapter boundary: the generic contract Tauricode Core uses to launch, observe, and control any agent runtime (OpenCode, Claude, future adapters) without depending on which one is underneath. See docs/STAGE2-RUNTIME-ADAPTER-PLAN.md."

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
