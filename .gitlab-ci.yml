# GitLab CI mirror of .github/workflows/tauricode-release.yml's Linux
# jobs only. Windows is NOT set up here: this project's Windows shared
# runners (windows-shared-runners-manager-1/2, confirmed via
# `glab api projects/.../runners`) are paused/inactive on the current
# GitLab tier - a real Windows build here needs either a paid tier with
# Windows shared runners enabled, or a self-hosted Windows runner
# registered to this project. Neither is set up; this is a known,
# disclosed gap, not an oversight.
#
# Runs on push to any branch and on tag push (t*) - unlike the GitHub
# workflow this mirrors, there's no separate release-asset-upload step
# here yet; that's GitHub's job for now (this pipeline proves the Linux
# build side compiles/bundles for real on GitLab's own infrastructure).

image: rust:latest

stages:
  - build

.install-bun:
  before_script:
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version

linux-desktop:
  stage: build
  extends: .install-bun
  script:
    - apt-get update
    - apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file
        libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - cd prototype/swarm_dashboard
    - bun install
    - bun run build
  artifacts:
    paths:
      - prototype/swarm_dashboard/src-tauri/target/release/bundle/deb/*.deb
      - prototype/swarm_dashboard/src-tauri/target/release/bundle/rpm/*.rpm
      - prototype/swarm_dashboard/src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: 30 days

linux-official-desktop:
  stage: build
  extends: .install-bun
  script:
    - apt-get update
    - apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file
        libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - cd packages/desktop-tauri
    - bun install
    - bun run build
  artifacts:
    paths:
      - packages/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
      - packages/desktop-tauri/src-tauri/target/release/bundle/rpm/*.rpm
      - packages/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
    expire_in: 30 days

linux-console:
  stage: build
  script:
    - cargo build --release --manifest-path crates/swarm-cli/Cargo.toml
    - cargo build --release --manifest-path crates/ecosystem-scheduler/Cargo.toml
  artifacts:
    paths:
      - crates/swarm-cli/target/release/swarm-cli
      - crates/ecosystem-scheduler/target/release/ecosystem-scheduler
    expire_in: 30 days
