[package]
name = "tauricode-desktop-tauri"
version = "0.1.0"
description = "Tauricode official agent-runtime-ui shell (ECO-DECISION-2026-08-19-TAURICODE-ROLE) - Slice 1: read-only EcosystemSnapshot display"
edition = "2021"
build = "build.rs"

[lib]
name = "tauricode_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# Canonical public observer source. The exact revision is pinned so a moving
# branch cannot silently change Tauricode's observed-state contract.
ecosystem-observer = { git = "https://github.com/juv4uk/ecosystem-observer.git", rev = "3dea1a79978c6e52ecea63f77b1c50098d16b885" }
