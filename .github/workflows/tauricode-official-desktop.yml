name: Tauricode official desktop-tauri build check

# Real compile gate for packages/desktop-tauri/ (the ACCEPTED
# agent-runtime-ui architecture, ECO-DECISION-2026-08-19-TAURICODE-*),
# distinct from prototype/swarm_dashboard/'s own workflows. Manual
# dispatch only for now, same as the swarm_dashboard prototype's first
# runs — no push trigger yet, this is Slice 1's first verification.
on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev pkg-config
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: cargo check (compiles for real, no bundling — bundle.active is false)
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: ecosystem-observer's own test suite (unrelated to this package's build, sanity check only)
        run: cargo test --manifest-path ../../crates/ecosystem-observer/Cargo.toml
