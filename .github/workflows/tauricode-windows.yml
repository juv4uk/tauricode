name: Tauricode Windows artifact

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: prototype/swarm_dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile=false

      - name: Build Tauricode Windows application
        run: bun run build

      - name: Upload Tauricode Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauricode-windows
          if-no-files-found: error
          path: |
            prototype/swarm_dashboard/src-tauri/target/release/bundle/msi/*.msi
            prototype/swarm_dashboard/src-tauri/target/release/bundle/nsis/*.exe
