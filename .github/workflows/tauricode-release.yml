name: Tauricode release

# Triggered by a `t*` tag push (matches this project's own tagging
# convention — t0.0.1 was cut by hand the same way). Builds six release
# targets in parallel — the prototype/swarm_dashboard/ shell + console
# tools (Windows/Linux) and the official packages/desktop-tauri/ shell
# (Windows/Linux) — then assembles one GitHub Release from whatever
# actually succeeded — never claims a target succeeded that didn't run.
on:
  push:
    tags:
      - "t*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (for a manual re-run)"
        required: true
        type: string

jobs:
  windows-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: prototype/swarm_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          if-no-files-found: error
          path: |
            prototype/swarm_dashboard/src-tauri/target/release/bundle/msi/*.msi
            prototype/swarm_dashboard/src-tauri/target/release/bundle/nsis/*.exe

  windows-console:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No root workspace Cargo.toml exists in this repo (each crates/*
      # crate is standalone, by design - see docs/STAGE2-RUNTIME-ADAPTER-PLAN.md's
      # own note on this convention) - `-p` package selection from repo
      # root isn't available, so each crate is built via its own
      # manifest-path instead, into its own target/ directory.
      - run: cargo build --release --manifest-path crates/swarm-cli/Cargo.toml
      - run: cargo build --release --manifest-path crates/ecosystem-scheduler/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: windows-console
          if-no-files-found: error
          path: |
            crates/swarm-cli/target/release/swarm-cli.exe
            crates/ecosystem-scheduler/target/release/ecosystem-scheduler.exe

  linux-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/swarm_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Package list per Tauri v2's own Linux prerequisites doc, not
      # guessed - this is the standard apt set for building a Tauri v2
      # app on Ubuntu (webkit2gtk 4.1, not the older 4.0 tauricode's own
      # earlier donor-build investigation hit version-drift on).
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          if-no-files-found: error
          path: |
            prototype/swarm_dashboard/src-tauri/target/release/bundle/deb/*.deb
            prototype/swarm_dashboard/src-tauri/target/release/bundle/rpm/*.rpm
            prototype/swarm_dashboard/src-tauri/target/release/bundle/appimage/*.AppImage

  linux-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path crates/swarm-cli/Cargo.toml
      - run: cargo build --release --manifest-path crates/ecosystem-scheduler/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: linux-console
          if-no-files-found: error
          path: |
            crates/swarm-cli/target/release/swarm-cli
            crates/ecosystem-scheduler/target/release/ecosystem-scheduler

  # The official Tauricode shell (ECO-DECISION-2026-08-19-TAURICODE-ROLE),
  # packages/desktop-tauri/ - distinct from prototype/swarm_dashboard/
  # above. Same build recipe (already twice verified today for the
  # prototype): bundle.targets: "all" + both icon formats declared, so
  # this doesn't hit the same icon.png/bundle-target CI failures found
  # and fixed earlier.
  windows-official-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-official-desktop
          if-no-files-found: error
          path: |
            packages/desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
            packages/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe

  linux-official-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-official-desktop
          if-no-files-found: error
          path: |
            packages/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            packages/desktop-tauri/src-tauri/target/release/bundle/rpm/*.rpm
            packages/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    needs:
      [windows-desktop, windows-console, linux-desktop, linux-console, windows-official-desktop, linux-official-desktop]
    # Runs even if some targets failed - reports honestly on whichever
    # artifacts actually exist rather than requiring all four or none.
    if: always()
    runs-on: ubuntu-latest
    # Default GITHUB_TOKEN is read-only for releases unless explicitly
    # granted contents: write here - confirmed by a real CI failure
    # (HTTP 403 Resource not accessible by integration on
    # `gh release create`), not predicted.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List collected artifacts
        run: find dist -type f
      - name: Determine tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `dist/*/*` is only two levels deep - console artifacts nest a
          # full crate-relative path (dist/linux-console/swarm-cli/target/
          # release/swarm-cli), so that glob matched a directory
          # ("swarm-cli") and gh failed with "is a directory". A NUL-safe
          # array of real files (not `$(find ...)`, unquoted word-splitting
          # would break on the Windows bundle names, which contain spaces)
          # is the actual fix - confirmed by a real CI failure, not
          # predicted.
          mapfile -d '' -t assets < <(find dist -type f -print0)
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "Tauricode ${{ steps.tag.outputs.tag }}" \
            --notes "Automated release build: prototype/swarm_dashboard (Windows/Linux desktop + console) and the official packages/desktop-tauri agent-runtime-ui (Windows/Linux). See individual job logs for which targets actually succeeded - this step attaches whatever artifacts were produced, never claims a target that didn't run." \
            --repo "${{ github.repository }}" \
            "${assets[@]}" || \
          gh release upload "${{ steps.tag.outputs.tag }}" "${assets[@]}" --repo "${{ github.repository }}" --clobber
